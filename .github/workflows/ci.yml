name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --dev

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test -- --run

      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --dev

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The docs site typechecks the library source through a path mapping
      # (`reactolith` -> ../src), so it needs the root install for React's
      # types as well as its own.
      - run: npm ci --dev

      - run: npm ci
        working-directory: docs

      - run: npm run typecheck
        working-directory: docs

      - run: npm run build
        working-directory: docs
