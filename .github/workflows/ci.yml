name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor the dev dependencies declare (jsdom 30 wants
        # ^22.22.2 || ^24.15.0 || >=26); 24 is the active LTS line.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci --dev

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test -- --run

      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --dev

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # The docs site typechecks the library source through a path mapping
      # (`reactolith` -> ../src), so it needs the root install for React's
      # types as well as its own.
      - run: npm ci --dev

      - run: npm ci
        working-directory: docs

      - run: npm run typecheck
        working-directory: docs

      - run: npm run build
        working-directory: docs
