name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The docs build aliases the `reactolith` import to the library's
      # src/, which lives in a separate repository. Check it out here and
      # point REACTOLITH_LIB at it during the build.
      - name: Checkout reactolith library
        uses: actions/checkout@v6
        with:
          repository: reactolith/reactolith
          ref: main
          path: .reactolith-lib

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci --dev

      - name: Install reactolith library dependencies
        working-directory: .reactolith-lib
        run: npm install --no-fund --no-audit --ignore-scripts
        continue-on-error: true

      - run: npm run build
        env:
          REACTOLITH_LIB: ${{ github.workspace }}/.reactolith-lib

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
