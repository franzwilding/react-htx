version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # eslint 10 is blocked by eslint-plugin-react@7.37.5, whose peer range
      # stops at ^9.7 — and 7.37.5 is its latest release, so there is nothing
      # to upgrade to. Drop these two entries once the plugin ships eslint 10
      # support; eslint 9 is out of support, so it is worth watching.
      - dependency-name: eslint
        versions:
          - 10.x
      - dependency-name: "@eslint/js"
        versions:
          - 10.x
      # TypeScript 7 breaks `npm run build`: rollup-plugin-dts needs the
      # compiler API, which the 7.0 native compiler no longer exposes. Taking
      # it is a toolchain change (add @typescript/typescript6, or bundle the
      # declarations some other way), not a version bump.
      - dependency-name: typescript
        versions:
          - 7.x

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
