framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native
    php_errors:
        log: true
    form: true
    validation:
        email_validation_mode: html5
    csrf_protection: true
    router:
        utf8: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        # Disable CSRF in tests: the WebTestCase posts payloads directly and
        # cannot run reactolith's client-side token injector. CSRF stays on in
        # dev / prod because that's where it matters.
        csrf_protection: false
